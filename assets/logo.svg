<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 54" fill="none" role="img" aria-label="ASA — Adi Shmueli Architect">
  <title>ASA — Adi Shmueli Architect</title>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400&amp;display=swap');
    </style>
  </defs>

  <!-- "ASA" wordmark in Orbitron -->
  <text
    x="0" y="34"
    font-family="'Orbitron', monospace"
    font-weight="400"
    font-size="28"
    letter-spacing="8"
    fill="#2A2826"
  >ASA</text>

  <!-- Baseline rule -->
  <line x1="0" y1="42" x2="160" y2="42" stroke="#C8C4BF" stroke-width="0.75"/>

  <!-- "ARCHITECT" subtitle -->
  <text
    x="0" y="52"
    font-family="Jost, system-ui, sans-serif"
    font-weight="200"
    font-size="6.5"
    letter-spacing="5.5"
    fill="#6B6864"
  >ARCHITECT</text>
</svg>
