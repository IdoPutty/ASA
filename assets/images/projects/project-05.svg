<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <!-- Background: lightest in the set -->
  <rect width="600" height="450" fill="#EEEEED"/>

  <!-- Apartment outer walls (thick) -->
  <rect x="70" y="60" width="460" height="320" fill="none" stroke="#706E68" stroke-width="14"/>
  <rect x="70" y="60" width="460" height="320" fill="#E8E7E3" stroke="#929088" stroke-width="0.8"/>
  <rect x="84" y="74" width="432" height="292" fill="#F0EFED"/>

  <!-- Interior partition walls -->
  <!-- Horizontal partitions -->
  <rect x="84" y="200" width="200" height="8" fill="#C8C7C3" stroke="#929088" stroke-width="0.4"/>
  <rect x="300" y="200" width="216" height="8" fill="#C8C7C3" stroke="#929088" stroke-width="0.4"/>
  <rect x="84" y="270" width="100" height="8" fill="#C8C7C3" stroke="#929088" stroke-width="0.4"/>
  <!-- Vertical partitions -->
  <rect x="280" y="74" width="8" height="134" fill="#C8C7C3" stroke="#929088" stroke-width="0.4"/>
  <rect x="390" y="74" width="8" height="134" fill="#C8C7C3" stroke="#929088" stroke-width="0.4"/>
  <rect x="180" y="208" width="8" height="158" fill="#C8C7C3" stroke="#929088" stroke-width="0.4"/>
  <rect x="390" y="208" width="8" height="158" fill="#C8C7C3" stroke="#929088" stroke-width="0.4"/>

  <!-- Bathroom walls -->
  <rect x="84" y="74" width="100" height="8" fill="#C8C7C3" stroke="#929088" stroke-width="0.4"/>
  <rect x="84" y="74" width="8" height="130" fill="#C8C7C3" stroke="#929088" stroke-width="0.4"/>

  <!-- Doors (gap in wall + quarter-arc swing) -->
  <!-- Main entrance door (north wall) -->
  <rect x="306" y="60" width="36" height="16" fill="#EEEEED"/>
  <path d="M306,74 Q306,60 322,60" fill="none" stroke="#929088" stroke-width="0.8"/>

  <!-- Living to bedroom door -->
  <rect x="280" y="148" width="8" height="28" fill="#F0EFED"/>
  <path d="M280,148 Q296,148 296,162" fill="none" stroke="#929088" stroke-width="0.8"/>

  <!-- Bedroom to bath door -->
  <rect x="84" y="148" width="28" height="8" fill="#F0EFED"/>
  <path d="M84,148 Q84,162 100,162" fill="none" stroke="#929088" stroke-width="0.8"/>

  <!-- Kitchen opening to living -->
  <rect x="390" y="138" width="8" height="28" fill="#F0EFED"/>

  <!-- Bathroom fixtures -->
  <!-- Bathtub -->
  <rect x="94" y="82" width="70" height="36" rx="4" fill="#DDDCDA" stroke="#929088" stroke-width="0.8"/>
  <ellipse cx="129" cy="100" rx="26" ry="12" fill="#E8E7E3" stroke="#B1AFA9" stroke-width="0.6"/>
  <!-- WC -->
  <ellipse cx="96" cy="162" rx="12" ry="14" fill="#DDDCDA" stroke="#929088" stroke-width="0.7"/>
  <rect x="84" y="158" width="24" height="10" rx="2" fill="#DDDCDA" stroke="#929088" stroke-width="0.7"/>
  <!-- Sink -->
  <rect x="148" y="160" width="24" height="20" rx="2" fill="#DDDCDA" stroke="#929088" stroke-width="0.7"/>

  <!-- Kitchen counter (L-shape) -->
  <rect x="398" y="82" width="110" height="18" fill="#DDDCDA" stroke="#929088" stroke-width="0.7"/>
  <rect x="490" y="82" width="18" height="100" fill="#DDDCDA" stroke="#929088" stroke-width="0.7"/>
  <!-- Kitchen island -->
  <rect x="410" y="130" width="60" height="30" fill="#E8E7E3" stroke="#B1AFA9" stroke-width="0.7" stroke-dasharray="0"/>

  <!-- Columns (exposed) -->
  <rect x="182" y="202" width="18" height="18" fill="#B1AFA9" stroke="#929088" stroke-width="0.8"/>
  <rect x="388" y="202" width="18" height="18" fill="#B1AFA9" stroke="#929088" stroke-width="0.8"/>
  <rect x="182" y="76" width="18" height="18" fill="#B1AFA9" stroke="#929088" stroke-width="0.8"/>
  <rect x="388" y="76" width="18" height="18" fill="#B1AFA9" stroke="#929088" stroke-width="0.8"/>

  <!-- Room labels -->
  <text x="98"  y="145" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="7.5" letter-spacing="2" fill="#929088">BATH</text>
  <text x="150" y="115" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="8" letter-spacing="2" fill="#929088">BEDROOM</text>
  <text x="160" y="240" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="8" letter-spacing="2" fill="#929088">LIVING</text>
  <text x="210" y="310" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="8" letter-spacing="2" fill="#929088">DINING</text>
  <text x="415" y="115" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="8" letter-spacing="2" fill="#929088">KITCHEN</text>
  <text x="420" y="290" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="8" letter-spacing="2" fill="#929088">BED 2</text>

  <!-- North arrow -->
  <line x1="555" y1="380" x2="555" y2="358" stroke="#929088" stroke-width="1"/>
  <polygon points="555,354 551,364 559,364" fill="#929088"/>
  <text x="551" y="394" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="9" fill="#929088">N</text>

  <!-- Label -->
  <line x1="40" y1="418" x2="560" y2="418" stroke="#C8C7C3" stroke-width="0.5"/>
  <text x="40" y="435" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="9" letter-spacing="3" fill="#929088">05 — APARTMENT 14B</text>
  <text x="380" y="435" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="9" letter-spacing="3" fill="#B1AFA9">FLOOR PLAN 1:75</text>
</svg>
