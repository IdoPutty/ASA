<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <!-- Background -->
  <rect width="600" height="450" fill="#DDDCDA"/>

  <!-- Outer building footprint — thick walls (double line) -->
  <!-- Outer wall -->
  <rect x="90" y="55" width="420" height="320" fill="none" stroke="#706E68" stroke-width="16"/>
  <!-- Inner wall face -->
  <rect x="90" y="55" width="420" height="320" fill="#D4D2CE" stroke="#929088" stroke-width="0.8"/>

  <!-- Interior fill (rooms) -->
  <rect x="106" y="71" width="388" height="288" fill="#E0DFDB"/>

  <!-- Courtyard void (central opening) -->
  <rect x="200" y="145" width="200" height="170" fill="#CCCAC5" stroke="#929088" stroke-width="1"/>
  <!-- Courtyard label -->
  <text x="245" y="233" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="8" letter-spacing="3" fill="#929088">COURT</text>

  <!-- Interior partition walls -->
  <!-- Left side rooms -->
  <line x1="106" y1="185" x2="200" y2="185" stroke="#929088" stroke-width="1.2"/>
  <line x1="106" y1="265" x2="200" y2="265" stroke="#929088" stroke-width="1.2"/>
  <!-- Right side rooms -->
  <line x1="400" y1="185" x2="494" y2="185" stroke="#929088" stroke-width="1.2"/>
  <line x1="400" y1="265" x2="494" y2="265" stroke="#929088" stroke-width="1.2"/>
  <!-- Top rooms -->
  <line x1="210" y1="71" x2="210" y2="145" stroke="#929088" stroke-width="1.2"/>
  <line x1="300" y1="71" x2="300" y2="145" stroke="#929088" stroke-width="1.2"/>
  <line x1="390" y1="71" x2="390" y2="145" stroke="#929088" stroke-width="1.2"/>
  <!-- Bottom rooms -->
  <line x1="210" y1="315" x2="210" y2="359" stroke="#929088" stroke-width="1.2"/>
  <line x1="300" y1="315" x2="300" y2="359" stroke="#929088" stroke-width="1.2"/>
  <line x1="390" y1="315" x2="390" y2="359" stroke="#929088" stroke-width="1.2"/>

  <!-- Door openings (gaps in walls with swing arcs) -->
  <!-- Main entrance south -->
  <rect x="282" y="355" width="36" height="16" fill="#DDDCDA"/>
  <path d="M282,355 Q282,371 298,371" fill="none" stroke="#929088" stroke-width="0.8"/>
  <!-- Courtyard access east -->
  <rect x="394" y="222" width="12" height="16" fill="#CCCAC5"/>
  <path d="M394,222 Q400,222 400,238" fill="none" stroke="#929088" stroke-width="0.8"/>
  <!-- Courtyard access west -->
  <rect x="194" y="222" width="12" height="16" fill="#CCCAC5"/>
  <path d="M206,222 Q200,222 200,238" fill="none" stroke="#929088" stroke-width="0.8"/>

  <!-- Tree in courtyard (linden) -->
  <circle cx="300" cy="230" r="30" fill="none" stroke="#B1AFA9" stroke-width="0.8" stroke-dasharray="4,3"/>
  <circle cx="300" cy="230" r="4" fill="#B1AFA9"/>
  <line x1="300" y1="226" x2="300" y2="200" stroke="#B1AFA9" stroke-width="0.5"/>

  <!-- Compass -->
  <circle cx="540" cy="90" r="22" fill="none" stroke="#929088" stroke-width="0.6"/>
  <line x1="540" y1="72" x2="540" y2="108" stroke="#929088" stroke-width="0.8"/>
  <line x1="518" y1="90" x2="562" y2="90" stroke="#929088" stroke-width="0.8"/>
  <polygon points="540,68 537,78 543,78" fill="#929088"/>
  <text x="536" y="84" font-family="Jost, system-ui, sans-serif" font-weight="300" font-size="9" fill="#929088">N</text>

  <!-- Room labels -->
  <text x="118" y="133" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="7.5" letter-spacing="1" fill="#929088">LIVING</text>
  <text x="118" y="222" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="7.5" letter-spacing="1" fill="#929088">STUDY</text>
  <text x="118" y="305" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="7.5" letter-spacing="1" fill="#929088">KITCHEN</text>
  <text x="418" y="133" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="7.5" letter-spacing="1" fill="#929088">BED 1</text>
  <text x="418" y="222" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="7.5" letter-spacing="1" fill="#929088">BED 2</text>
  <text x="418" y="305" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="7.5" letter-spacing="1" fill="#929088">BATH</text>

  <!-- Label -->
  <line x1="40" y1="418" x2="560" y2="418" stroke="#B1AFA9" stroke-width="0.5"/>
  <text x="40" y="435" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="9" letter-spacing="3" fill="#929088">02 — THE LINDEN HOUSE</text>
  <text x="400" y="435" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="9" letter-spacing="3" fill="#B1AFA9">GROUND FLOOR PLAN 1:100</text>
</svg>
