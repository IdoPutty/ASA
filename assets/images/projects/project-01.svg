<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <!-- Background: light concrete -->
  <rect width="600" height="450" fill="#E8E7E3"/>

  <!-- Ground hatch -->
  <rect x="0" y="370" width="600" height="80" fill="#DDDCDA"/>
  <line x1="0" y1="370" x2="600" y2="370" stroke="#B1AFA9" stroke-width="1"/>
  <!-- Ground texture lines -->
  <line x1="60" y1="380" x2="120" y2="380" stroke="#C5C3BE" stroke-width="0.5"/>
  <line x1="180" y1="385" x2="250" y2="385" stroke="#C5C3BE" stroke-width="0.5"/>
  <line x1="310" y1="380" x2="380" y2="380" stroke="#C5C3BE" stroke-width="0.5"/>
  <line x1="430" y1="385" x2="500" y2="385" stroke="#C5C3BE" stroke-width="0.5"/>

  <!-- Left wing -->
  <rect x="80" y="220" width="160" height="150" fill="#D8D7D3" stroke="#929088" stroke-width="0.8"/>
  <!-- Left wing roof (flat with parapet) -->
  <rect x="76" y="206" width="168" height="18" fill="#CCCAC5" stroke="#929088" stroke-width="0.8"/>

  <!-- Main central block -->
  <rect x="200" y="160" width="200" height="210" fill="#D0CFCB" stroke="#929088" stroke-width="0.8"/>
  <!-- Main block pitched roof -->
  <polygon points="190,160 300,80 410,160" fill="#C4C3BE" stroke="#929088" stroke-width="0.8"/>

  <!-- Right wing -->
  <rect x="360" y="220" width="160" height="150" fill="#D8D7D3" stroke="#929088" stroke-width="0.8"/>
  <!-- Right wing roof (flat with parapet) -->
  <rect x="356" y="206" width="168" height="18" fill="#CCCAC5" stroke="#929088" stroke-width="0.8"/>

  <!-- Chimney -->
  <rect x="270" y="88" width="22" height="40" fill="#CCCAC5" stroke="#929088" stroke-width="0.8"/>
  <rect x="267" y="86" width="28" height="6" fill="#B1AFA9" stroke="#929088" stroke-width="0.8"/>

  <!-- Windows — main block, upper -->
  <rect x="222" y="185" width="42" height="36" fill="#E8E7E3" stroke="#929088" stroke-width="0.8"/>
  <line x1="243" y1="185" x2="243" y2="221" stroke="#929088" stroke-width="0.5"/>
  <rect x="308" y="185" width="42" height="36" fill="#E8E7E3" stroke="#929088" stroke-width="0.8"/>
  <line x1="329" y1="185" x2="329" y2="221" stroke="#929088" stroke-width="0.5"/>

  <!-- Windows — main block, lower -->
  <rect x="222" y="255" width="42" height="60" fill="#E8E7E3" stroke="#929088" stroke-width="0.8"/>
  <line x1="243" y1="255" x2="243" y2="315" stroke="#929088" stroke-width="0.5"/>
  <rect x="308" y="255" width="42" height="60" fill="#E8E7E3" stroke="#929088" stroke-width="0.8"/>
  <line x1="329" y1="255" x2="329" y2="315" stroke="#929088" stroke-width="0.5"/>

  <!-- Main door -->
  <rect x="272" y="310" width="56" height="60" fill="#C4C3BE" stroke="#929088" stroke-width="0.8"/>
  <line x1="300" y1="310" x2="300" y2="370" stroke="#929088" stroke-width="0.5"/>
  <!-- Door arch -->
  <path d="M272,310 Q300,284 328,310" fill="none" stroke="#929088" stroke-width="0.8"/>

  <!-- Left wing windows -->
  <rect x="108" y="248" width="36" height="44" fill="#E8E7E3" stroke="#929088" stroke-width="0.8"/>
  <line x1="126" y1="248" x2="126" y2="292" stroke="#929088" stroke-width="0.5"/>
  <rect x="164" y="248" width="36" height="44" fill="#E8E7E3" stroke="#929088" stroke-width="0.8"/>

  <!-- Right wing windows -->
  <rect x="396" y="248" width="36" height="44" fill="#E8E7E3" stroke="#929088" stroke-width="0.8"/>
  <line x1="414" y1="248" x2="414" y2="292" stroke="#929088" stroke-width="0.5"/>
  <rect x="452" y="248" width="36" height="44" fill="#E8E7E3" stroke="#929088" stroke-width="0.8"/>

  <!-- Steps at door -->
  <rect x="264" y="368" width="72" height="6" fill="#C4C3BE" stroke="#929088" stroke-width="0.5"/>
  <rect x="260" y="372" width="80" height="4" fill="#B1AFA9" stroke="#929088" stroke-width="0.5"/>

  <!-- Drawing label -->
  <line x1="40" y1="420" x2="560" y2="420" stroke="#B1AFA9" stroke-width="0.5"/>
  <text x="40" y="437" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="9" letter-spacing="3" fill="#929088">01 — VILLA SERAVEZZA</text>
  <text x="440" y="437" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="9" letter-spacing="3" fill="#B1AFA9">SOUTH ELEVATION</text>

  <!-- Scale bar -->
  <line x1="40" y1="410" x2="40" y2="416" stroke="#B1AFA9" stroke-width="0.5"/>
  <line x1="40" y1="413" x2="110" y2="413" stroke="#B1AFA9" stroke-width="0.5"/>
  <line x1="110" y1="410" x2="110" y2="416" stroke="#B1AFA9" stroke-width="0.5"/>
  <text x="66" y="410" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="7" letter-spacing="1" fill="#B1AFA9">10 m</text>

  <!-- North arrow -->
  <line x1="555" y1="415" x2="555" y2="400" stroke="#929088" stroke-width="0.8"/>
  <polygon points="555,398 552,406 558,406" fill="#929088"/>
  <text x="552" y="428" font-family="Jost, system-ui, sans-serif" font-weight="200" font-size="7" fill="#929088">N</text>
</svg>
